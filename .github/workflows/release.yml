# Cut a release by pushing a tag:  git tag v1.1.0 && git push origin v1.1.0
#
# The tag is the trigger, but argus/__init__.py is the source of truth — a tag
# that disagrees with __version__ fails here rather than shipping a mislabelled
# release. Release notes come from the matching CHANGELOG.md section.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build notes for, e.g. v1.1.0'
        required: true
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      - name: Tag must match argus.__version__
        run: |
          CODE=$(python -c "import argus; print(argus.__version__)")
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$CODE" != "$TAG_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION but argus/__init__.py says $CODE. Bump __version__ and CHANGELOG.md, then re-tag."
            exit 1
          fi
          echo "version $CODE matches the tag"

      - name: Tests must pass before anything ships
        run: python -m pytest tests/ -q

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # Everything between this version's heading and the next one.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/       {exit}
            found                   {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## [$VERSION]' section in CHANGELOG.md — add one before tagging."
            exit 1
          fi
          echo "--- release notes ---"; cat notes.md

      - name: Publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "ARGUS ${{ steps.tag.outputs.tag }}" \
            --notes-file notes.md \
            --verify-tag
